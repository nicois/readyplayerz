[package]
name = "arena"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.129"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "console", "Window", "Document", "Element", "HtmlCanvasElement",
  "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlBuffer",
  "WebGlVertexArrayObject", "WebGlUniformLocation", "WebGlTexture", "WebGlFramebuffer",
  "WebGlRenderbuffer",
] }

[profile.release]
opt-level = 3
lto = true
