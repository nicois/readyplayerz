[package]
name = "arena"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.129"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "console", "Window", "Document", "Element", "HtmlCanvasElement",
  "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlBuffer",
  "WebGlVertexArrayObject", "WebGlUniformLocation", "WebGlTexture", "WebGlFramebuffer",
  "WebGlRenderbuffer",
] }

[dev-dependencies]
# the network bench's tick times, as the CPU time the test's own thread took (see `sim::load`)
libc = "0.2"

[workspace]
# the game server, run natively; the wasm build only ever builds the game itself
members = ["server"]
default-members = ["."]

[profile.release]
opt-level = 3
lto = true

[lints.clippy]
# every default clippy lint is an error; the few deliberate exceptions are allowed at the site
all = "deny"
# unwraps and expects stay in tests only
unwrap_used = "deny"
expect_used = "deny"
