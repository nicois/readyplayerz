# Tests, builds the wasm client and deploys web/ to Cloudflare Pages on every push to main, then the game server to
# Fly (see fly.toml). Needs the repo secrets CLOUDFLARE_API_TOKEN (with the "Cloudflare Pages: Edit" permission),
# CLOUDFLARE_ACCOUNT_ID and FLY_API_TOKEN (a deploy token for the Fly app).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # must match the wasm-bindgen version in Cargo.lock
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129

      - run: cargo test --release

      - run: ./build.sh

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web --project-name=readyplayerz --branch=main --commit-dirty=true

  # after the tests have passed; a deploy restarts the server, ending any game being played
  game-server:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # one machine only: every room lives in its memory
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
